name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned: the test runner ships inside the CLI, so a new release can't turn every PR red on its own. Bump it on
      # purpose, in its own PR.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the plugin and its hooks
        run: claude plugin validate plugin/.claude-plugin/plugin.json --strict
      - name: Run the tests
        run: claude plugin test plugin
      - name: Check formatting
        run: npx --yes prettier@3.9.9 --check .
